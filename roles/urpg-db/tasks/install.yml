- name: Install MariaDB
  become: yes
  yum:
    name: mariadb105-server
    state: present

- name: Add [mysqld] section to my.cnf if not present
  become: yes
  lineinfile:
    dest: '/etc/my.cnf'
    line: '[mysqld]'
    state: present
    backup: true

- name: Enable lower case table names in my.cnf
  become: yes
  lineinfile:
    dest: '/etc/my.cnf'
    line: 'lower_case_table_names = 1'
    firstmatch: yes
    insertafter: '.mysqld.'
    state: present
    backup: true

# Verify with:
# sudo systemctl list-unit-files | grep enabled
- name: Configure MariaDB to start on server boot
  become: yes
  service:
    name: mariadb
    enabled: yes

# Verify with:
# ps -ef | grep mariadb
- name: Start MariaDB
  become: yes
  service: 
    name: mariadb
    state: started